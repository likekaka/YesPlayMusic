name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # lockfile 与 package.json 的 resolutions 演进不完全同步，先不用 frozen-lockfile
      - run: yarn install --ignore-engines --network-timeout 600000
      - run: yarn build
